[package]
name = "GSBuilder"
version = "1.5.5"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml_edit = "0.22"
toml = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rustyline = "19.0.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
