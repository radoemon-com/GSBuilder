[package]
name = "GSBuilder"
version = "1.0.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
flate2 = "1"
rustyline = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
toml_edit = "0.22"
toml = "0.8"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
